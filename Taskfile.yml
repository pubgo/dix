version: 3

tasks:
  test:
    desc: Run tests with coverage
    cmds:
      - go test -race -v ./... -covermode=atomic -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
      # example is an independent Go module; ./... above never type-checks it.
      - go build -C example ./...
      - go test -C example -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --timeout=5m --verbose

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  default:
    desc: Run tests
    deps: [test]

  web-demo:
    desc: Run web demo (example/http, 五视图 UI)
    cmds:
      - go run -C example ./http
