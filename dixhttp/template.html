<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dix 依赖关系可视化</title>
    <link rel="stylesheet" href="__DIX_BASE_PATH__/static/css/legacy.css?v=legacy1">
    <script src="__DIX_BASE_PATH__/static/vendor/tailwind.js?v=legacy1"></script>
    <script src="__DIX_BASE_PATH__/static/vendor/alpine.min.js?v=legacy1" defer></script>
    <script src="__DIX_BASE_PATH__/static/vendor/vis-network.min.js?v=legacy1"></script>
    <script src="__DIX_BASE_PATH__/static/vendor/mermaid.min.js?v=legacy1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#0f766e',
                            600: '#0d9488',
                            700: '#115e59',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-stone-100 h-screen flex flex-col overflow-hidden text-stone-800">
    <div x-data="app()" x-init="init()" class="flex flex-col h-full">
        <!-- Compact architecture header -->
        <header class="bg-white border-b border-stone-200 px-4 py-2 flex-shrink-0">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0">
                    <h1 class="text-sm font-semibold tracking-tight text-stone-900 flex-shrink-0">Dix</h1>
                    <p class="text-xs text-stone-500 truncate hidden sm:block">依赖架构</p>
                    <div class="hidden md:flex items-center gap-3 text-[11px] text-stone-400 tabular-nums">
                        <span x-text="stats.package_count + ' 包'"></span>
                        <span x-text="stats.provider_count + ' Providers'"></span>
                        <span x-text="stats.edge_count + ' 边'"></span>
                    </div>
                </div>
                <div class="relative flex-shrink-0" x-data="{ open:false }">
                    <button type="button" @click="open = !open"
                        class="px-2.5 py-1.5 text-xs rounded-md border border-stone-200 bg-stone-50 hover:bg-stone-100 text-stone-700">
                        诊断
                    </button>
                    <div x-show="open" x-cloak @click.outside="open = false"
                        class="absolute right-0 mt-1.5 w-64 bg-white text-stone-700 rounded-lg shadow-lg border border-stone-200 z-50 overflow-hidden">
                        <button type="button" @click="openDiagnosticModal('trace'); open=false"
                            class="w-full text-left px-3 py-2 text-sm hover:bg-stone-50 flex items-center justify-between">
                            <span>调用链 Trace</span>
                            <span class="text-xs text-stone-400" x-text="traceRecords.length"></span>
                        </button>
                        <button type="button" @click="openDiagnosticModal('runtime'); open=false"
                            class="w-full text-left px-3 py-2 text-sm hover:bg-stone-50 flex items-center justify-between border-t border-stone-100">
                            <span>Provider 启动耗时</span>
                            <span class="text-xs text-stone-400" x-text="runtimeStats.length"></span>
                        </button>
                        <button type="button" @click="openDiagnosticModal('errors'); open=false"
                            class="w-full text-left px-3 py-2 text-sm hover:bg-stone-50 flex items-center justify-between border-t border-stone-100">
                            <span>最近注入错误</span>
                            <span class="text-xs text-stone-400" x-text="recentErrors.length"></span>
                        </button>
                        <button type="button" @click="openDiagnosticModal('error-guide'); open=false"
                            class="w-full text-left px-3 py-2 text-sm hover:bg-stone-50 border-t border-stone-100">
                            错误类型说明
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden min-h-0">
            <!-- Left: package scope -->
            <aside :class="sidebarCollapsed ? 'w-10' : 'w-64'"
                class="bg-white border-r border-stone-200 flex flex-col flex-shrink-0 transition-[width] duration-200">
                <div class="h-10 px-1.5 border-b border-stone-200 bg-stone-50 flex items-center"
                    :class="sidebarCollapsed ? 'justify-center' : 'justify-between px-2'">
                    <h3 x-show="!sidebarCollapsed" class="text-xs font-semibold text-stone-600">包范围</h3>
                    <button type="button" @click="sidebarCollapsed = !sidebarCollapsed"
                        class="p-1.5 hover:bg-stone-200 rounded text-stone-500"
                        :title="sidebarCollapsed ? '展开包列表' : '收起'">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                :d="sidebarCollapsed ? 'M13 5l7 7-7 7M5 5l7 7-7 7' : 'M11 19l-7-7 7-7m8 14l-7-7 7-7'" />
                        </svg>
                    </button>
                </div>

                <template x-if="!sidebarCollapsed">
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <div class="p-2 border-b border-stone-100">
                            <input type="text" x-model="packageSearch" placeholder="筛选包…"
                                class="w-full px-2 py-1.5 text-xs border border-stone-200 rounded-md focus:ring-1 focus:ring-primary-500 outline-none">
                        </div>
                        <div class="flex-1 overflow-y-auto p-1.5 space-y-1">
                            <button type="button" @click="selectPackage(null)"
                                :class="!currentPackage ? 'bg-primary-600 text-white' : 'hover:bg-stone-100 text-stone-700'"
                                class="w-full text-left px-2.5 py-2 rounded-md text-xs transition">
                                <div class="font-medium">全部</div>
                                <div class="opacity-70 mt-0.5" x-text="totalProviders + ' providers'"></div>
                            </button>
                            <template x-for="grp in packageGroups" :key="'pg-' + grp.key">
                                <div class="rounded-md border border-stone-100 overflow-hidden">
                                    <button type="button"
                                        class="w-full flex items-center justify-between px-2 py-1.5 text-[11px] font-semibold text-stone-500 bg-stone-50 hover:bg-stone-100"
                                        @click="togglePackageGroup(grp.key)">
                                        <span x-text="grp.label"></span>
                                        <span class="tabular-nums font-normal text-stone-400"
                                            x-text="grp.packages.length + ' · ' + grp.count"></span>
                                    </button>
                                    <div x-show="isPackageGroupOpen(grp.key)" class="p-1 space-y-0.5">
                                        <template x-for="pkg in grp.packages" :key="pkg.name">
                                            <button type="button" @click="selectPackage(pkg.name)"
                                                :class="currentPackage === pkg.name ? 'bg-primary-600 text-white' : 'hover:bg-stone-100 text-stone-700'"
                                                class="w-full text-left px-2 py-1.5 rounded text-xs transition">
                                                <div class="font-medium break-all" x-text="packageLeafLabel(pkg.name)"></div>
                                                <div class="opacity-70 mt-0.5 tabular-nums" x-text="pkg.provider_count + ' p'"></div>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </aside>

            <!-- Main Graph Area -->
            <main class="flex-1 flex flex-col bg-stone-50 min-w-0">
                <!-- Primary toolbar -->
                <div class="px-3 py-2 border-b border-stone-200 bg-white flex items-center gap-2 flex-wrap">
                    <div class="inline-flex rounded-md border border-stone-200 overflow-hidden text-xs">
                        <button type="button" @click="switchView('providers')"
                            :class="currentView === 'providers' ? 'bg-primary-600 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'"
                            class="px-2.5 py-1.5 border-r border-stone-200">Providers</button>
                        <button type="button" @click="switchView('types')"
                            :class="currentView === 'types' ? 'bg-primary-600 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'"
                            class="px-2.5 py-1.5 border-r border-stone-200">类型</button>
                        <button type="button" @click="switchView('modules')"
                            :class="currentView === 'modules' ? 'bg-primary-600 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'"
                            class="px-2.5 py-1.5">模块</button>
                    </div>

                    <select x-model="currentDepth" @change="onDepthChange()"
                        class="px-2 py-1.5 text-xs border border-stone-200 rounded-md bg-white outline-none"
                        title="金字塔截断深度">
                        <template x-for="opt in depthSelectOptions()" :key="'depth-' + opt.value">
                            <option :value="opt.value" x-text="opt.label"></option>
                        </template>
                    </select>

                    <span class="text-[11px] text-stone-400 tabular-nums hidden lg:inline"
                        x-show="pyramidStatus" x-text="pyramidStatus"></span>

                    <div class="flex items-center gap-1.5" x-show="pyramidFocusProviderId || pyramidFocusTypeId" x-cloak>
                        <span class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded px-2 py-1 max-w-[160px] truncate"
                            x-text="'聚焦: ' + (pyramidFocusProviderId || pyramidFocusTypeId)"></span>
                        <button type="button" @click="pyramidFocusProviderId = null; pyramidFocusTypeId = null; renderGraph()"
                            class="text-[11px] text-stone-500 underline">清除</button>
                    </div>

                    <div class="flex items-center gap-1.5" x-show="selectedNode && selectedNode.id" x-cloak>
                        <button type="button" @click="hideSelectedNodeAndDownstream()"
                            class="text-[11px] px-2 py-1 rounded bg-rose-600 text-white hover:bg-rose-700"
                            :title="'约 ' + estimateHiddenCount(selectedNode.id) + ' 节点 · H'">
                            隐藏及下游
                        </button>
                    </div>

                    <button type="button" @click="keepBusinessEntriesOnly()"
                        class="text-[11px] px-2 py-1 rounded border border-stone-200 bg-white text-stone-700 hover:bg-stone-50">
                        只留业务入口
                    </button>

                    <div class="relative" x-show="hiddenSeeds.length" x-cloak>
                        <button type="button" @click="hiddenListOpen = !hiddenListOpen"
                            class="text-[11px] px-2 py-1 rounded border border-stone-200 bg-stone-50 text-stone-700"
                            x-text="'已隐藏 ' + hiddenSeeds.length"></button>
                        <button type="button" @click="clearHiddenSeeds()"
                            class="ml-1 text-[11px] text-stone-500 underline">全部恢复</button>
                        <div x-show="hiddenListOpen" x-cloak @click.outside="hiddenListOpen = false"
                            class="absolute left-0 top-full mt-1 z-40 w-72 max-h-64 overflow-y-auto rounded-lg border border-stone-200 bg-white shadow-lg p-2 space-y-1">
                            <template x-for="seed in hiddenSeeds" :key="'hide-' + seed.id">
                                <button type="button"
                                    class="w-full flex items-center justify-between gap-2 text-left text-[11px] px-2 py-1.5 rounded hover:bg-stone-50"
                                    @click="unhideSeed(seed.id)">
                                    <span class="truncate" x-text="seed.label"></span>
                                    <span class="text-primary-600 flex-shrink-0">恢复</span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="flex-1 min-w-[8rem] max-w-sm relative" x-data="{ open: false }">
                        <input type="text" x-model="globalSearch" @input="onGlobalSearchInput()" @focus="open = true"
                            @keydown.escape="open = false" @keydown.enter="selectFirstSearchResult()"
                            placeholder="搜索类型 / 函数…"
                            class="w-full pl-2 pr-2 py-1.5 text-xs border border-stone-200 rounded-md focus:ring-1 focus:ring-primary-500 outline-none">
                        <div x-show="open && globalSearch.length > 0 && searchResults.length > 0"
                            @click.outside="open = false" x-cloak
                            class="absolute top-full left-0 right-0 mt-1 bg-white border border-stone-200 rounded-lg shadow-lg max-h-80 overflow-y-auto z-50">
                            <template x-for="(result, index) in searchResults" :key="result.id">
                                <div @click="selectSearchResult(result); open = false"
                                    :class="index === 0 ? 'bg-primary-50' : ''"
                                    class="px-3 py-2 hover:bg-stone-50 cursor-pointer border-b border-stone-100 last:border-0">
                                    <div class="flex items-center gap-2">
                                        <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-stone-100 text-stone-600"
                                            x-text="result.type === 'provider' ? 'Provider' : 'Type'"></span>
                                        <span class="text-xs font-medium text-stone-700 truncate" x-text="result.label"></span>
                                    </div>
                                    <div class="text-[11px] text-stone-400 truncate mt-0.5" x-text="result.fullName"></div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="relative">
                        <button type="button" @click="toolbarMoreOpen = !toolbarMoreOpen"
                            class="px-2.5 py-1.5 text-xs rounded-md border border-stone-200 bg-white hover:bg-stone-50 text-stone-600">
                            更多
                        </button>
                        <div x-show="toolbarMoreOpen" x-cloak @click.outside="toolbarMoreOpen = false"
                            class="absolute right-0 top-full mt-1 z-50 w-80 rounded-lg border border-stone-200 bg-white shadow-xl p-3 space-y-3">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[11px] text-stone-500">布局</span>
                                <select x-model="currentLayout" @change="saveLocalState(); renderGraph()"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded-md">
                                    <option value="hierarchical">层级</option>
                                    <option value="force">力导向</option>
                                </select>
                            </div>
                            <label class="flex items-center gap-2 text-xs text-stone-600">
                                <input type="checkbox" x-model="aggregateGroups" @change="saveLocalState(); renderGraph()" class="rounded border-stone-300">
                                按分组聚合
                            </label>
                            <label class="flex items-center gap-2 text-xs text-stone-600" title="边过多时优先保留跨包与枢纽边">
                                <input type="checkbox" x-model="edgeDeclutter" @change="saveLocalState(); renderGraph()" class="rounded border-stone-300">
                                边降噪
                            </label>
                            <label class="flex items-center gap-2 text-xs text-stone-600">
                                <input type="checkbox" x-model="debugGroupMatching" class="rounded border-stone-300">
                                调试分组匹配
                            </label>
                            <div>
                                <div class="text-[11px] text-stone-500 mb-1">前缀过滤</div>
                                <div class="flex gap-1">
                                    <input type="text" x-model="filterPrefix" @input="renderGraph()" placeholder="包路径 / 类型 / 函数"
                                        class="flex-1 px-2 py-1 text-xs border border-stone-200 rounded-md outline-none">
                                    <button type="button" @click="filterPrefix=''; renderGraph()"
                                        class="px-2 py-1 text-xs border border-stone-200 rounded-md">清</button>
                                </div>
                            </div>
                            <details class="text-xs">
                                <summary class="cursor-pointer text-stone-500">分组清单</summary>
                                <div class="mt-2 border border-stone-200 rounded-md p-2 space-y-2 max-h-48 overflow-y-auto">
                                    <div class="flex gap-1">
                                        <input type="text" x-model="newGroupName" placeholder="组名"
                                            class="flex-1 px-1.5 py-1 text-xs border border-stone-200 rounded">
                                        <input type="text" x-model="newGroupPrefix" placeholder="前缀"
                                            class="flex-[2] px-1.5 py-1 text-xs border border-stone-200 rounded">
                                        <button type="button" @click="addGroup()"
                                            class="px-2 py-1 text-xs bg-primary-600 text-white rounded">加</button>
                                    </div>
                                    <template x-for="(grp, gidx) in groupRules" :key="grp.name">
                                        <div class="border border-stone-100 rounded p-1.5">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-medium text-stone-700" x-text="grp.name"></span>
                                                <button type="button" @click="removeGroup(gidx)" class="text-rose-500 text-[11px]">删</button>
                                            </div>
                                            <template x-for="(p, pidx) in grp.prefixes" :key="p + pidx">
                                                <div class="flex justify-between gap-1 text-[11px] text-stone-500">
                                                    <span class="truncate" x-text="p"></span>
                                                    <button type="button" @click="removePrefix(gidx, pidx)">×</button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </details>
                            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-stone-100">
                                <button type="button" @click="fitGraph(); toolbarMoreOpen=false"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded hover:bg-stone-50" :disabled="!network">适应全图</button>
                                <button type="button" @click="focusHubNode(); toolbarMoreOpen=false"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded hover:bg-stone-50" :disabled="!network">聚焦枢纽</button>
                                <button type="button" @click="resetView(); toolbarMoreOpen=false"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded hover:bg-stone-50">重置</button>
                                <button type="button" @click="exportSvg(); toolbarMoreOpen=false"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded hover:bg-stone-50" :disabled="!network">SVG</button>
                                <button type="button" @click="openMermaid(); toolbarMoreOpen=false"
                                    class="px-2 py-1 text-xs border border-stone-200 rounded hover:bg-stone-50" :disabled="!network">Mermaid</button>
                            </div>
                        </div>
                    </div>

                    <button type="button" @click="rightPanelCollapsed = !rightPanelCollapsed"
                        class="px-2 py-1.5 text-xs rounded-md border border-stone-200 bg-white hover:bg-stone-50 text-stone-600"
                        x-text="rightPanelCollapsed ? '清单' : '收起右栏'"></button>
                </div>

                <!-- Graph Container -->
                <div class="flex-1 relative min-h-0">
                    <div id="network" class="absolute inset-0 bg-stone-50"></div>

                    <!-- Graph right-click menu -->
                    <div x-show="graphContextMenu" x-cloak
                        class="fixed z-50 min-w-[220px] rounded-lg border border-slate-200 bg-white shadow-xl py-1"
                        :style="graphContextMenu ? `left:${Math.min(graphContextMenu.x, window.innerWidth - 240)}px;top:${Math.min(graphContextMenu.y, window.innerHeight - 200)}px` : ''"
                        @click.outside="clearHidePreview(); graphContextMenu = null"
                        @keydown.escape.window="clearHidePreview(); graphContextMenu = null">
                        <div class="px-3 py-1.5 text-[11px] text-gray-500 truncate max-w-[260px]"
                            x-text="graphContextMenu && graphContextMenu.label"></div>
                        <div class="px-3 pb-1 text-[10px] text-rose-500/80">红色高亮 = 将被隐藏 · H 隐藏 / U 多步撤销</div>
                        <button type="button"
                            class="w-full text-left px-3 py-2 text-sm text-rose-700 hover:bg-rose-50"
                            @click="hideFromContextMenu()">
                            <span x-text="graphContextMenu ? ('隐藏此节点及下游 (' + graphContextMenu.count + ')') : '隐藏及下游'"></span>
                        </button>
                        <template x-for="opt in (graphContextMenu && graphContextMenu.packageOptions) || []" :key="'pkg-hide-' + opt.prefix">
                            <button type="button"
                                class="w-full text-left px-3 py-2 text-sm text-rose-700/90 hover:bg-rose-50"
                                @mouseenter="previewPackageHide(opt.prefix)"
                                @click="hidePackageFromContextMenu(opt.prefix, opt.label)">
                                <span x-text="'隐藏包 ' + opt.label + ' (' + opt.count + ')'"></span>
                            </button>
                        </template>
                        <button type="button"
                            class="w-full text-left px-3 py-2 text-sm text-gray-600 hover:bg-gray-50"
                            @click="clearHidePreview(); graphContextMenu = null">取消</button>
                    </div>

                    <!-- Hide undo toast (right); density tip stays left — leave ~11rem gap -->
                    <div x-show="hideToast" x-cloak
                        class="absolute bottom-3 right-3 z-30 flex items-center gap-3 max-w-[min(20rem,calc(100%-11rem))] rounded-lg border border-slate-200 bg-slate-900 text-white px-3 py-2 shadow-lg">
                        <span class="text-xs leading-snug flex-1" x-text="hideToast && hideToast.message"></span>
                        <button type="button" x-show="hideToast && hideToast.canUndo"
                            class="text-xs font-medium text-amber-300 hover:text-amber-200"
                            @click="undoLastHide()">撤销</button>
                    </div>

                    <div x-show="densityWarning.show && densityWarning.minimized" x-cloak
                        class="absolute bottom-3 left-3 z-20 max-w-[calc(100%-11rem)]">
                        <button type="button"
                            class="px-3 py-1.5 text-xs rounded-full border border-amber-300 bg-amber-50 text-amber-900 shadow-md hover:bg-amber-100"
                            @click="densityWarning.minimized = false"
                            x-text="densityWarning.suggestKeepBusiness
                                ? '入口较多 · 收敛建议'
                                : ((densityWarning.edgesDropped > 0 && !(densityWarning.hubs && densityWarning.hubs.length))
                                    ? ('已降噪 ' + densityWarning.edgesDropped + ' 边 · 查看')
                                    : '图规模过大 · 查看建议')">
                        </button>
                    </div>

                    <div x-show="densityWarning.show && !densityWarning.minimized" x-cloak
                        class="absolute bottom-3 left-3 z-20 w-[min(22rem,calc(100%-11rem))] rounded-lg border border-amber-200 bg-amber-50/95 text-amber-950 shadow-lg backdrop-blur-sm">
                        <div class="flex items-start gap-2 px-3 pt-2.5 pb-1">
                            <p class="text-xs leading-snug flex-1 min-w-0" x-text="densityWarning.message"></p>
                            <button type="button"
                                class="flex-shrink-0 px-1.5 py-0.5 text-[11px] text-amber-800/80 hover:text-amber-950"
                                title="收起提示"
                                @click="densityWarning.minimized = true">收起</button>
                        </div>
                        <div class="px-3 pb-2 flex flex-wrap gap-1.5">
                            <button type="button"
                                class="px-2 py-1 text-[11px] border border-rose-200 rounded bg-white text-rose-800 hover:bg-rose-50"
                                x-show="densityWarning.suggestKeepBusiness"
                                @click="keepBusinessEntriesOnly(); densityWarning.minimized = true">只留业务入口</button>
                            <button type="button"
                                class="px-2 py-1 text-[11px] border border-amber-200 rounded bg-white hover:bg-amber-50"
                                x-show="densityWarning.suggestModules"
                                @click="switchView('modules')">模块地图</button>
                            <button type="button"
                                class="px-2 py-1 text-[11px] border border-amber-200 rounded bg-white hover:bg-amber-50"
                                x-show="densityWarning.suggestAggregate && !aggregateGroups"
                                @click="aggregateGroups = true; saveLocalState(); renderGraph()">分组聚合</button>
                            <button type="button"
                                class="px-2 py-1 text-[11px] border border-amber-200 rounded bg-white hover:bg-amber-50"
                                x-show="densityWarning.hubs.length"
                                @click="densityWarning.expanded = !densityWarning.expanded"
                                x-text="densityWarning.expanded ? '收起枢纽' : '耦合枢纽'"></button>
                        </div>
                        <div class="px-3 pb-2.5 max-h-40 overflow-auto border-t border-amber-100"
                            x-show="densityWarning.expanded && densityWarning.hubs.length">
                            <table class="w-full text-[11px] mt-1.5">
                                <thead>
                                    <tr class="text-amber-800/70">
                                        <th class="text-left font-medium py-0.5">枢纽</th>
                                        <th class="text-right font-medium py-0.5">度数</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="h in densityWarning.hubs" :key="h.id">
                                        <tr>
                                            <td class="font-mono truncate max-w-[14rem] py-0.5">

                                                                <button x-show="traceTreeMode && item._canToggle"
                                                                    @click.stop="toggleTraceSpanCollapse(group.traceId, item.span_id)"
                                                                    class="px-1 py-0.5 rounded border border-gray-300 bg-white text-[10px] text-gray-600 hover:bg-gray-50"
                                                                    :title="isTraceSpanCollapsed(group.traceId, item.span_id) ? '展开子链路' : '折叠子链路'"
                                                                    x-text="isTraceSpanCollapsed(group.traceId, item.span_id) ? '▸' : '▾'"></button>
                                                                <span x-show="traceTreeMode"
                                                                    class="px-1 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px]"
                                                                    x-text="`L${item._depth || 0}`"></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-700 font-medium"
                                                                    x-text="item.operation || '-' "></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
                                                                    :class="item.status === 'error' ? 'bg-red-100 text-red-700' : (item.status === 'start' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700')"
                                                                    x-text="item.status || 'ok'"></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 text-[10px]"
                                                                    x-text="item.event || '-' "></span>
                                                                <span class="text-[10px] text-gray-400"
                                                                    x-text="formatErrorTime(item.occurred_at_unix_nano)"></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all">
                                                                <span class="text-gray-500">span:</span>
                                                                <span x-text="item.span_id || '-' "></span>
                                                                <span class="text-gray-500 ml-2">parent:</span>
                                                                <span x-text="item.parent_span_id || '-' "></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all"
                                                                x-show="traceProviderLabel(item)">
                                                                <span x-text="traceProviderLabel(item)"></span>
                                                            </div>
                                                            <details class="mt-1"
                                                                x-show="traceProviderFunctions(item).length > 1">
                                                                <summary
                                                                    class="text-[10px] text-gray-500 cursor-pointer hover:text-gray-700">
                                                                    全部 provider
                                                                </summary>
                                                                <ul class="mt-1 space-y-0.5">
                                                                    <template
                                                                        x-for="(fn, fidx) in traceProviderFunctions(item)"
                                                                        :key="`trace-event-provider-${item.span_id || 'x'}-${fidx}`">
                                                                        <li class="text-[10px] text-gray-600 break-all"
                                                                            x-text="fn"></li>
                                                                    </template>
                                                                </ul>
                                                            </details>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceOutputType(item)"
                                                                x-text="`output: ${traceOutputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceInputType(item)"
                                                                x-text="`input: ${traceInputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceTypeMeta(item)"
                                                                x-text="traceTypeMeta(item)">
                                                            </div>
                                                            <div x-show="traceErrorText(item)"
                                                                class="mt-1 rounded border border-red-200 bg-red-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-red-600">
                                                                    error
                                                                </div>
                                                                <pre class="mt-0.5 text-[11px] text-red-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorMultilineText(item)"></pre>
                                                            </div>
                                                            <div x-show="traceErrorContext(item)"
                                                                class="mt-1 rounded border border-amber-200 bg-amber-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-amber-700">
                                                                    ctx
                                                                </div>
                                                                <pre class="mt-0.5 text-[10px] text-amber-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorContextMultiline(item)"></pre>
                                                            </div>
                                                            <div class="text-[10px] text-blue-700 break-all"
                                                                x-show="tracePackagePathLabel(item)"
                                                                x-text="`pkg: ${tracePackagePathLabel(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="item.duration_ns"
                                                                x-text="`duration: ${formatDurationNs(item.duration_ns)}`">
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Mermaid Modal -->
        <div x-show="mermaidOpen" x-cloak class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
            @keydown.escape.window="mermaidOpen = false">
            <div class="bg-white w-[90vw] h-[85vh] rounded-xl shadow-xl flex flex-col">
                <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
                    <div class="font-semibold text-gray-700">🧩 Mermaid 预览</div>
                    <button @click="mermaidOpen = false"
                        class="px-2 py-1 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                        关闭
                    </button>
                </div>
                <div class="flex-1 grid grid-cols-2 gap-4 p-4 overflow-hidden">
                    <div class="flex flex-col h-full">
                        <div class="text-xs text-gray-500 mb-2">Mermaid 源码</div>
                        <textarea x-model="mermaidSource"
                            class="flex-1 w-full text-xs font-mono border border-gray-200 rounded-lg p-2 resize-none"></textarea>
                        <div class="mt-2 flex items-center gap-2">
                            <button @click="copyMermaidSource()"
                                class="px-3 py-1.5 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                                复制源码
                            </button>
                            <button @click="renderMermaid()"
                                class="px-3 py-1.5 text-xs bg-primary-500 text-white rounded-md hover:bg-primary-600">
                                重新渲染
                            </button>
                            <div x-show="mermaidError" class="text-xs text-red-500" x-text="mermaidError"></div>
                        </div>
                    </div>
                    <div class="flex flex-col h-full">
                        <div class="text-xs text-gray-500 mb-2">预览</div>
                        <div class="flex-1 border border-gray-200 rounded-lg p-3 overflow-auto mermaid-preview"
                            x-html="mermaidSvg"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>window.DIX_BASE = "__DIX_BASE_PATH__";</script>
    <script type="module" src="__DIX_BASE_PATH__/static/js/graph_state.mjs?v=legacy-arch31"></script>
    <script type="module" src="__DIX_BASE_PATH__/static/js/graph_workbench.mjs?v=legacy-arch31"></script>
    <script src="__DIX_BASE_PATH__/static/js/legacy/app.js?v=legacy-arch31"></script>
</body>

</html>
