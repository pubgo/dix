<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dix 依赖关系可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .vis-tooltip {
            background: white !important;
            border: 1px solid #e5e7eb !important;
            border-radius: 8px !important;
            padding: 12px !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
            font-size: 12px !important;
            line-height: 1.6 !important;
            max-width: 400px !important;
            font-family: ui-monospace, monospace !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f5ff',
                            100: '#e0eaff',
                            500: '#667eea',
                            600: '#5a67d8',
                            700: '#4c51bf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    <div x-data="app()" x-init="init()" class="flex flex-col h-full">
        <!-- Header -->
        <header class="bg-gradient-to-r from-primary-500 to-purple-600 text-white px-6 py-4 shadow-lg flex-shrink-0">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-semibold flex items-center gap-2">
                        <span>🔗</span> Dix 依赖关系可视化
                    </h1>
                    <div class="mt-1 text-sm text-white/80 flex gap-6">
                        <span>📦 <span x-text="stats.package_count">-</span> 包</span>
                        <span>⚡ <span x-text="stats.provider_count">-</span> Providers</span>
                        <span>📎 <span x-text="stats.edge_count">-</span> 依赖</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Left Sidebar - Package List (Collapsible) -->
            <aside 
                :class="sidebarCollapsed ? 'w-12' : 'w-72'"
                class="bg-white border-r border-gray-200 flex flex-col flex-shrink-0 transition-all duration-300"
            >
                <!-- Collapse Toggle Button -->
                <div class="p-2 border-b border-gray-200 bg-gray-50 flex items-center" :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">
                    <h3 x-show="!sidebarCollapsed" class="text-sm font-semibold text-gray-600 pl-2">📦 包列表</h3>
                    <button 
                        @click="sidebarCollapsed = !sidebarCollapsed"
                        class="p-1.5 hover:bg-gray-200 rounded transition"
                        :title="sidebarCollapsed ? '展开侧边栏' : '收起侧边栏'"
                    >
                        <svg x-show="!sidebarCollapsed" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                        </svg>
                        <svg x-show="sidebarCollapsed" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
                
                <!-- Sidebar Content (hidden when collapsed) -->
                <template x-if="!sidebarCollapsed">
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <div class="p-4 border-b border-gray-200">
                            <div class="relative">
                                <input 
                                    type="text" 
                                    x-model="packageSearch"
                                    placeholder="搜索包名..."
                                    class="w-full pl-9 pr-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                                >
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2">
                            <!-- All packages option -->
                            <div 
                                @click="selectPackage(null)"
                                :class="{'bg-primary-500 text-white': !currentPackage, 'hover:bg-gray-100': currentPackage}"
                                class="p-3 rounded-lg cursor-pointer mb-1 transition"
                            >
                                <div class="font-medium text-sm">📁 全部</div>
                                <span 
                                    :class="{'bg-white/20 text-white': !currentPackage, 'bg-gray-200 text-gray-600': currentPackage}"
                                    class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs"
                                    x-text="totalProviders + ' providers'"
                                ></span>
                            </div>
                            <!-- Package items -->
                            <template x-for="pkg in filteredPackages" :key="pkg.name">
                                <div 
                                    @click="selectPackage(pkg.name)"
                                    :class="{'bg-primary-500 text-white': currentPackage === pkg.name, 'hover:bg-gray-100': currentPackage !== pkg.name}"
                                    class="p-3 rounded-lg cursor-pointer mb-1 transition"
                                >
                                    <div class="font-medium text-sm break-all" x-text="formatPackageName(pkg.name)"></div>
                                    <span 
                                        :class="{'bg-white/20 text-white': currentPackage === pkg.name, 'bg-gray-200 text-gray-600': currentPackage !== pkg.name}"
                                        class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs"
                                        x-text="pkg.provider_count + ' providers'"
                                    ></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                
                <!-- Collapsed state icons -->
                <div x-show="sidebarCollapsed" class="flex-1 overflow-y-auto py-2">
                    <div 
                        @click="sidebarCollapsed = false; selectPackage(null)"
                        :class="{'bg-primary-500 text-white': !currentPackage}"
                        class="mx-2 p-2 rounded-lg cursor-pointer mb-1 flex items-center justify-center hover:bg-gray-100 transition"
                        title="全部"
                    >
                        📁
                    </div>
                </div>
            </aside>

            <!-- Main Graph Area -->
            <main class="flex-1 flex flex-col bg-white min-w-0">
                <!-- Toolbar -->
                <div class="px-4 py-3 border-b border-gray-200 bg-gray-50 flex items-center gap-4 flex-wrap">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">视图:</span>
                        <button 
                            @click="switchView('providers')"
                            :class="{'bg-primary-500 text-white border-primary-500': currentView === 'providers', 'bg-white hover:bg-gray-50': currentView !== 'providers'}"
                            class="px-3 py-1.5 text-sm border rounded-lg transition flex items-center gap-1"
                        >
                            <span>⚡</span> Providers
                        </button>
                        <button 
                            @click="switchView('types')"
                            :class="{'bg-primary-500 text-white border-primary-500': currentView === 'types', 'bg-white hover:bg-gray-50': currentView !== 'types'}"
                            class="px-3 py-1.5 text-sm border rounded-lg transition flex items-center gap-1"
                        >
                            <span>🔷</span> 类型依赖
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">布局:</span>
                        <select 
                            x-model="currentLayout"
                            @change="renderGraph()"
                            class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary-500 outline-none"
                        >
                            <option value="hierarchical">层级布局</option>
                            <option value="force">力导向</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">深度:</span>
                        <select 
                            x-model="currentDepth"
                            class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary-500 outline-none"
                        >
                            <option value="1">1 级</option>
                            <option value="2">2 级</option>
                            <option value="3">3 级</option>
                            <option value="5">5 级</option>
                            <option value="0">全部</option>
                        </select>
                    </div>
                    <button 
                        @click="resetView()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition flex items-center gap-1"
                    >
                        <span>🔄</span> 重置
                    </button>
                    
                    <!-- Global Search -->
                    <div class="flex-1"></div>
                    <div class="relative" x-data="{ open: false }">
                        <input 
                            type="text" 
                            x-model="globalSearch"
                            @input="onGlobalSearchInput()"
                            @focus="open = true"
                            @keydown.escape="open = false"
                            @keydown.enter="selectFirstSearchResult()"
                            placeholder="搜索类型或函数名..."
                            class="w-64 pl-9 pr-4 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                        >
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
                        
                        <!-- Search Results Dropdown -->
                        <div 
                            x-show="open && globalSearch.length > 0 && searchResults.length > 0"
                            @click.outside="open = false"
                            x-cloak
                            class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-80 overflow-y-auto z-50"
                        >
                            <template x-for="(result, index) in searchResults" :key="result.id">
                                <div 
                                    @click="selectSearchResult(result); open = false"
                                    :class="{'bg-primary-50': index === 0}"
                                    class="px-3 py-2 hover:bg-gray-100 cursor-pointer border-b border-gray-100 last:border-0"
                                >
                                    <div class="flex items-center gap-2">
                                        <span 
                                            :class="{
                                                'bg-green-100 text-green-700': result.type === 'provider',
                                                'bg-blue-100 text-blue-700': result.type === 'type'
                                            }"
                                            class="px-1.5 py-0.5 rounded text-xs font-medium"
                                            x-text="result.type === 'provider' ? 'Provider' : 'Type'"
                                        ></span>
                                        <span class="text-sm font-medium text-gray-700 truncate" x-text="result.label"></span>
                                    </div>
                                    <div class="text-xs text-gray-400 truncate mt-0.5" x-text="result.fullName"></div>
                                </div>
                            </template>
                            <div x-show="searchResults.length === 0 && globalSearch.length > 0" class="px-3 py-4 text-center text-gray-400 text-sm">
                                未找到匹配结果
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Graph Container -->
                <div class="flex-1 relative">
                    <div id="network" class="w-full h-full"></div>
                    <!-- Loading Overlay -->
                    <div 
                        x-show="loading" 
                        x-cloak
                        class="absolute inset-0 bg-white/90 flex items-center justify-center z-50"
                    >
                        <div class="text-center">
                            <div class="w-10 h-10 border-3 border-gray-200 border-t-primary-500 rounded-full animate-spin mx-auto mb-3"></div>
                            <div class="text-gray-500 text-sm">加载中...</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar - Details -->
            <aside class="w-80 bg-white border-l border-gray-200 flex flex-col flex-shrink-0">
                <div class="p-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-sm font-semibold text-gray-600">📋 节点详情</h3>
                </div>
                <div class="flex-1 overflow-y-auto p-4">
                    <!-- Empty State -->
                    <div x-show="!selectedNode" class="text-center py-12 text-gray-400">
                        <div class="text-5xl mb-3">👆</div>
                        <div>点击节点查看详情</div>
                    </div>
                    <!-- Provider Detail -->
                    <template x-if="selectedNode && selectedNode.data && selectedNode.data.function_name">
                        <div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">函数名</h4>
                                <div class="text-sm text-gray-700 break-all leading-relaxed" x-text="selectedNode.data.function_name"></div>
                            </div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">输出类型</h4>
                                <div 
                                    @click="showDependencyGraph(selectedNode.data.output_type, 'type')"
                                    class="text-sm text-primary-600 break-all leading-relaxed cursor-pointer hover:underline" 
                                    x-text="selectedNode.data.output_type"
                                ></div>
                            </div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">
                                    输入类型 (<span x-text="(selectedNode.data.input_types || []).length"></span>)
                                </h4>
                                <ul class="space-y-1">
                                    <template x-for="inputType in (selectedNode.data.input_types || [])" :key="inputType">
                                        <li 
                                            @click="showDependencyGraph(inputType, 'type')"
                                            class="px-3 py-2 bg-gray-100 rounded text-xs break-all cursor-pointer hover:bg-primary-100 transition"
                                            x-text="inputType"
                                        ></li>
                                    </template>
                                </ul>
                            </div>
                            <button 
                                @click="showDependencyGraph(selectedNode.data.output_type, 'type')"
                                class="w-full px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition flex items-center justify-center gap-2"
                            >
                                <span>🔍</span> 查看依赖关系图
                            </button>
                        </div>
                    </template>
                    <!-- Type Detail -->
                    <template x-if="selectedNode && selectedNode.data && selectedNode.data.type === 'type'">
                        <div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">类型</h4>
                                <div class="text-sm text-gray-700 break-all leading-relaxed" x-text="selectedNode.data.fullType"></div>
                            </div>
                            <button 
                                @click="showDependencyGraph(selectedNode.data.fullType, 'type')"
                                class="w-full px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition flex items-center justify-center gap-2"
                            >
                                <span>🔍</span> 查看依赖关系
                            </button>
                        </div>
                    </template>
                </div>
                <!-- Legend -->
                <div class="p-4 border-t border-gray-200 bg-gray-50">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase mb-3">图例</h4>
                    <div class="space-y-2 text-xs">
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded bg-amber-400"></div>
                            <span>目标节点</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded bg-green-400"></div>
                            <span>依赖（上游）</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded bg-red-400"></div>
                            <span>被依赖（下游）</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded bg-blue-400"></div>
                            <span>类型节点</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        function app() {
            return {
                // State
                loading: true,
                sidebarCollapsed: false,
                stats: { provider_count: 0, object_count: 0, package_count: 0, edge_count: 0 },
                packages: [],
                packageSearch: '',
                globalSearch: '',
                searchResults: [],
                currentPackage: null,
                currentView: 'providers',
                currentLayout: 'hierarchical',
                currentDepth: '2',
                allData: null,
                selectedNode: null,
                network: null,

                // Computed
                get filteredPackages() {
                    const query = this.packageSearch.toLowerCase();
                    return this.packages
                        .filter(p => p.name.toLowerCase().includes(query))
                        .sort((a, b) => b.provider_count - a.provider_count);
                },

                get totalProviders() {
                    return this.packages.reduce((sum, p) => sum + p.provider_count, 0);
                },

                // Methods
                async init() {
                    await this.loadStats();
                    await this.loadPackages();
                    await this.loadDependencies();
                },

                async loadStats() {
                    try {
                        const res = await fetch('/api/stats');
                        this.stats = await res.json();
                    } catch (e) {
                        console.error('加载统计失败:', e);
                    }
                },

                async loadPackages() {
                    try {
                        const res = await fetch('/api/packages');
                        this.packages = await res.json();
                    } catch (e) {
                        console.error('加载包列表失败:', e);
                    }
                },

                async selectPackage(pkgName) {
                    this.currentPackage = pkgName;
                    await this.loadDependencies();
                },

                async loadDependencies() {
                    this.loading = true;
                    try {
                        let url = '/api/dependencies';
                        if (this.currentPackage) {
                            url += '?package=' + encodeURIComponent(this.currentPackage);
                        }
                        const res = await fetch(url);
                        this.allData = await res.json();
                        this.renderGraph();
                    } catch (e) {
                        console.error('加载依赖失败:', e);
                    } finally {
                        this.loading = false;
                    }
                },

                switchView(view) {
                    this.currentView = view;
                    this.renderGraph();
                },

                resetView() {
                    this.currentPackage = null;
                    this.currentView = 'providers';
                    this.packageSearch = '';
                    this.globalSearch = '';
                    this.searchResults = [];
                    this.selectedNode = null;
                    this.loadDependencies();
                },

                // Global search functionality
                onGlobalSearchInput() {
                    if (!this.allData || this.globalSearch.length < 1) {
                        this.searchResults = [];
                        return;
                    }

                    const query = this.globalSearch.toLowerCase();
                    const results = [];
                    const seen = new Set();

                    // Search in providers
                    this.allData.providers.forEach(provider => {
                        const fnName = provider.function_name || '';
                        const outputType = provider.output_type || '';
                        
                        if (fnName.toLowerCase().includes(query) || outputType.toLowerCase().includes(query)) {
                            if (!seen.has(provider.id)) {
                                seen.add(provider.id);
                                results.push({
                                    id: provider.id,
                                    type: 'provider',
                                    label: this.formatFunctionName(fnName),
                                    fullName: fnName,
                                    outputType: outputType,
                                    data: provider
                                });
                            }
                        }

                        // Also search input types
                        (provider.input_types || []).forEach(inputType => {
                            if (inputType.toLowerCase().includes(query) && !seen.has(inputType)) {
                                seen.add(inputType);
                                results.push({
                                    id: inputType,
                                    type: 'type',
                                    label: this.formatTypeName(inputType),
                                    fullName: inputType,
                                    data: { type: 'type', fullType: inputType }
                                });
                            }
                        });

                        // Search output type
                        if (outputType.toLowerCase().includes(query) && !seen.has(outputType)) {
                            seen.add(outputType);
                            results.push({
                                id: outputType,
                                type: 'type',
                                label: this.formatTypeName(outputType),
                                fullName: outputType,
                                data: { type: 'type', fullType: outputType }
                            });
                        }
                    });

                    // Limit results
                    this.searchResults = results.slice(0, 20);
                },

                selectSearchResult(result) {
                    this.globalSearch = '';
                    this.searchResults = [];
                    
                    if (result.type === 'type') {
                        // 类型：显示依赖关系图
                        this.showDependencyGraph(result.fullName, 'type');
                    } else if (result.type === 'provider') {
                        // Provider：以其输出类型为中心显示依赖图
                        this.showDependencyGraph(result.outputType, 'type');
                        this.selectedNode = { data: result.data };
                    }
                },

                selectFirstSearchResult() {
                    if (this.searchResults.length > 0) {
                        this.selectSearchResult(this.searchResults[0]);
                    }
                },

                // 显示以某个类型为中心的依赖图（包含依赖者和被依赖者）
                showDependencyGraph(targetType, nodeType) {
                    if (!this.allData) return;

                    const depth = parseInt(this.currentDepth) || 2;
                    const nodes = [];
                    const edges = [];
                    const nodeMap = new Map();

                    // 构建类型到 Provider 的映射
                    const typeToProviders = new Map(); // outputType -> providers
                    const typeToConsumers = new Map(); // inputType -> providers that use it
                    
                    this.allData.providers.forEach(provider => {
                        const outputType = provider.output_type;
                        if (outputType) {
                            if (!typeToProviders.has(outputType)) {
                                typeToProviders.set(outputType, []);
                            }
                            typeToProviders.get(outputType).push(provider);
                        }
                        
                        (provider.input_types || []).forEach(inputType => {
                            if (!typeToConsumers.has(inputType)) {
                                typeToConsumers.set(inputType, []);
                            }
                            typeToConsumers.get(inputType).push(provider);
                        });
                    });

                    // BFS 向上查找依赖（当前类型依赖什么）
                    const findDependencies = (startType, maxDepth) => {
                        const visited = new Set();
                        const queue = [{ type: startType, level: 0 }];
                        const result = [];

                        while (queue.length > 0) {
                            const { type, level } = queue.shift();
                            if (visited.has(type) || level > maxDepth) continue;
                            visited.add(type);

                            result.push({ type, level, direction: 'dependency' });

                            // 找到生产这个类型的 providers，获取它们的输入类型
                            const providers = typeToProviders.get(type) || [];
                            providers.forEach(p => {
                                (p.input_types || []).forEach(inputType => {
                                    if (!visited.has(inputType)) {
                                        queue.push({ type: inputType, level: level + 1 });
                                    }
                                });
                            });
                        }
                        return result;
                    };

                    // BFS 向下查找被依赖者（什么依赖当前类型）
                    const findDependents = (startType, maxDepth) => {
                        const visited = new Set();
                        const queue = [{ type: startType, level: 0 }];
                        const result = [];

                        while (queue.length > 0) {
                            const { type, level } = queue.shift();
                            if (visited.has(type) || level > maxDepth) continue;
                            visited.add(type);

                            if (level > 0) { // 不重复添加起始节点
                                result.push({ type, level, direction: 'dependent' });
                            }

                            // 找到使用这个类型作为输入的 providers，获取它们的输出类型
                            const consumers = typeToConsumers.get(type) || [];
                            consumers.forEach(p => {
                                const outputType = p.output_type;
                                if (outputType && !visited.has(outputType)) {
                                    queue.push({ type: outputType, level: level + 1 });
                                }
                            });
                        }
                        return result;
                    };

                    // 获取依赖和被依赖者
                    const dependencies = findDependencies(targetType, depth);
                    const dependents = findDependents(targetType, depth);

                    // 添加所有节点
                    const allTypes = [...dependencies, ...dependents];
                    allTypes.forEach(({ type, level, direction }) => {
                        if (!nodeMap.has(type)) {
                            const isTarget = type === targetType;
                            let bgColor, borderColor;
                            
                            if (isTarget) {
                                bgColor = '#fde68a'; borderColor = '#f59e0b'; // 目标：黄色
                            } else if (direction === 'dependency') {
                                bgColor = '#bbf7d0'; borderColor = '#22c55e'; // 依赖：绿色
                            } else {
                                bgColor = '#fecaca'; borderColor = '#ef4444'; // 被依赖：红色
                            }

                            nodes.push({
                                id: type,
                                label: this.formatTypeName(type),
                                title: `类型: ${type}\n层级: ${level}\n${direction === 'dependency' ? '← 依赖' : '→ 被依赖'}`,
                                color: { background: bgColor, border: borderColor },
                                level: direction === 'dependency' ? -level : level,
                                data: { type: 'type', fullType: type }
                            });
                            nodeMap.set(type, true);
                        }
                    });

                    // 添加边
                    this.allData.providers.forEach(provider => {
                        const outputType = provider.output_type;
                        (provider.input_types || []).forEach(inputType => {
                            if (nodeMap.has(inputType) && nodeMap.has(outputType)) {
                                const edgeId = `${inputType}->${outputType}`;
                                if (!nodeMap.has(edgeId)) {
                                    nodeMap.set(edgeId, true);
                                    edges.push({
                                        from: inputType,
                                        to: outputType,
                                        arrows: 'to',
                                        color: { color: '#9ca3af' }
                                    });
                                }
                            }
                        });
                    });

                    // 渲染图形
                    const container = document.getElementById('network');
                    const graphData = {
                        nodes: new vis.DataSet(nodes),
                        edges: new vis.DataSet(edges)
                    };

                    if (this.network) {
                        this.network.destroy();
                    }

                    this.network = new vis.Network(container, graphData, this.getNetworkOptions());

                    // 聚焦到目标节点
                    setTimeout(() => {
                        try {
                            this.network.selectNodes([targetType]);
                            this.network.focus(targetType, { scale: 1, animation: true });
                        } catch (e) {}
                    }, 100);

                    this.network.on('click', params => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = graphData.nodes.get(nodeId);
                            this.selectedNode = node;
                        }
                    });

                    // 双击展开该节点的依赖
                    this.network.on('doubleClick', params => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = graphData.nodes.get(nodeId);
                            if (node && node.data && node.data.fullType) {
                                this.showDependencyGraph(node.data.fullType, 'type');
                            }
                        }
                    });
                },

                renderGraph() {
                    if (!this.allData) return;

                    const nodes = [];
                    const edges = [];
                    const nodeMap = new Map();

                    if (this.currentView === 'providers') {
                        this.allData.providers.forEach((provider) => {
                            const providerNodeId = provider.id;
                            const fnName = this.formatFunctionName(provider.function_name);
                            const outputType = this.formatTypeName(provider.output_type);

                            // Provider node
                            if (!nodeMap.has(providerNodeId)) {
                                nodes.push({
                                    id: providerNodeId,
                                    label: fnName,
                                    title: this.buildProviderTooltip(provider),
                                    color: { background: '#bbf7d0', border: '#22c55e' },
                                    shape: 'box',
                                    font: { size: 11 },
                                    data: provider
                                });
                                nodeMap.set(providerNodeId, true);
                            }

                            // Output type node
                            if (!nodeMap.has(provider.output_type)) {
                                nodes.push({
                                    id: provider.output_type,
                                    label: outputType,
                                    title: '类型: ' + provider.output_type,
                                    color: { background: '#bfdbfe', border: '#3b82f6' },
                                    shape: 'ellipse',
                                    font: { size: 10 },
                                    data: { type: 'type', fullType: provider.output_type }
                                });
                                nodeMap.set(provider.output_type, true);
                            }

                            // Provider -> Output edge
                            edges.push({
                                from: providerNodeId,
                                to: provider.output_type,
                                arrows: 'to',
                                color: { color: '#22c55e' }
                            });

                            // Input types
                            (provider.input_types || []).forEach(inputType => {
                                if (!nodeMap.has(inputType)) {
                                    nodes.push({
                                        id: inputType,
                                        label: this.formatTypeName(inputType),
                                        title: '类型: ' + inputType,
                                        color: { background: '#bfdbfe', border: '#3b82f6' },
                                        shape: 'ellipse',
                                        font: { size: 10 },
                                        data: { type: 'type', fullType: inputType }
                                    });
                                    nodeMap.set(inputType, true);
                                }

                                edges.push({
                                    from: inputType,
                                    to: providerNodeId,
                                    arrows: 'to',
                                    dashes: true,
                                    color: { color: '#f59e0b' }
                                });
                            });
                        });
                    } else {
                        // Types view
                        this.allData.edges.forEach(edge => {
                            if (edge.type !== 'provider') return;

                            if (!nodeMap.has(edge.from)) {
                                nodes.push({
                                    id: edge.from,
                                    label: this.formatTypeName(edge.from),
                                    title: '类型: ' + edge.from,
                                    color: { background: '#bfdbfe', border: '#3b82f6' },
                                    data: { type: 'type', fullType: edge.from }
                                });
                                nodeMap.set(edge.from, true);
                            }

                            if (!nodeMap.has(edge.to)) {
                                nodes.push({
                                    id: edge.to,
                                    label: this.formatTypeName(edge.to),
                                    title: '类型: ' + edge.to,
                                    color: { background: '#bfdbfe', border: '#3b82f6' },
                                    data: { type: 'type', fullType: edge.to }
                                });
                                nodeMap.set(edge.to, true);
                            }

                            edges.push({
                                from: edge.from,
                                to: edge.to,
                                arrows: 'to',
                                color: { color: '#9ca3af' }
                            });
                        });
                    }

                    // Create network
                    const container = document.getElementById('network');
                    const data = {
                        nodes: new vis.DataSet(nodes),
                        edges: new vis.DataSet(edges)
                    };

                    const options = this.getNetworkOptions();

                    if (this.network) {
                        this.network.destroy();
                    }

                    this.network = new vis.Network(container, data, options);

                    // Click event
                    this.network.on('click', params => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = data.nodes.get(nodeId);
                            this.selectedNode = node;
                        }
                    });

                    // Double click to focus
                    this.network.on('doubleClick', params => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = data.nodes.get(nodeId);
                            if (node && node.data && node.data.type === 'type') {
                                this.focusOnType(node.data.fullType);
                            }
                        }
                    });
                },

                getNetworkOptions() {
                    const isHierarchical = this.currentLayout === 'hierarchical';
                    return {
                        nodes: {
                            shape: 'box',
                            font: { size: 12, face: 'system-ui, sans-serif' },
                            borderWidth: 2,
                            shadow: { enabled: true, size: 5, x: 2, y: 2 },
                            margin: 8
                        },
                        edges: {
                            width: 1.5,
                            smooth: isHierarchical
                                ? { type: 'cubicBezier', roundness: 0.4 }
                                : { type: 'continuous' }
                        },
                        physics: {
                            enabled: !isHierarchical,
                            stabilization: { iterations: 150 },
                            barnesHut: {
                                gravitationalConstant: -2000,
                                springLength: 150
                            }
                        },
                        interaction: {
                            hover: true,
                            tooltipDelay: 100,
                            zoomView: true,
                            dragView: true
                        },
                        layout: isHierarchical ? {
                            hierarchical: {
                                enabled: true,
                                direction: 'UD',
                                sortMethod: 'directed',
                                levelSeparation: 120,
                                nodeSpacing: 150,
                                treeSpacing: 150
                            }
                        } : {
                            hierarchical: { enabled: false }
                        }
                    };
                },

                async focusOnType(typeName) {
                    this.loading = true;
                    try {
                        const depth = parseInt(this.currentDepth) || 0;
                        const url = `/api/type/${encodeURIComponent(typeName)}?depth=${depth}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        this.renderTypeGraph(data);
                    } catch (e) {
                        console.error('加载类型详情失败:', e);
                    } finally {
                        this.loading = false;
                    }
                },

                renderTypeGraph(data) {
                    const nodes = [];
                    const edges = [];
                    const nodeMap = new Map();

                    data.nodes.forEach(node => {
                        if (!nodeMap.has(node.id)) {
                            const isRoot = node.id === data.root_type;
                            nodes.push({
                                id: node.id,
                                label: this.formatTypeName(node.type),
                                title: `类型: ${node.type}\n包: ${node.package}\n层级: ${node.level}`,
                                color: isRoot
                                    ? { background: '#fde68a', border: '#f59e0b' }
                                    : { background: '#bfdbfe', border: '#3b82f6' },
                                level: node.level,
                                data: { type: 'type', fullType: node.type }
                            });
                            nodeMap.set(node.id, true);
                        }
                    });

                    data.edges.forEach(edge => {
                        edges.push({
                            from: edge.from,
                            to: edge.to,
                            arrows: 'to',
                            color: { color: '#9ca3af' }
                        });
                    });

                    const container = document.getElementById('network');
                    const graphData = {
                        nodes: new vis.DataSet(nodes),
                        edges: new vis.DataSet(edges)
                    };

                    if (this.network) {
                        this.network.destroy();
                    }

                    this.network = new vis.Network(container, graphData, this.getNetworkOptions());

                    this.network.on('click', params => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = graphData.nodes.get(nodeId);
                            this.selectedNode = node;
                        }
                    });
                },

                // Helpers
                formatPackageName(name) {
                    if (!name) return '(anonymous)';
                    const parts = name.split('/');
                    if (parts.length > 2) {
                        return '.../' + parts.slice(-2).join('/');
                    }
                    return name;
                },

                formatTypeName(typeName) {
                    if (!typeName) return '';
                    let t = typeName.replace(/^\*/, '').replace(/^\[\]/, '');
                    const lastSlash = t.lastIndexOf('/');
                    if (lastSlash > -1) {
                        t = t.substring(lastSlash + 1);
                    }
                    if (t.length > 30) {
                        t = '...' + t.slice(-27);
                    }
                    return t;
                },

                formatFunctionName(fnName) {
                    if (!fnName) return 'unknown';
                    const lastSlash = fnName.lastIndexOf('/');
                    let name = lastSlash > -1 ? fnName.substring(lastSlash + 1) : fnName;
                    if (name.length > 35) {
                        name = '...' + name.slice(-32);
                    }
                    return name;
                },

                buildProviderTooltip(provider) {
                    let tip = '函数: ' + provider.function_name + '\n';
                    tip += '输出: ' + provider.output_type + '\n';
                    if (provider.input_types && provider.input_types.length > 0) {
                        tip += '输入:\n';
                        provider.input_types.forEach((t, i) => {
                            tip += '  ' + (i + 1) + '. ' + t + '\n';
                        });
                    }
                    return tip;
                }
            };
        }
    </script>
</body>
