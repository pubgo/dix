<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dix 依赖关系可视化</title>
    <link rel="stylesheet" href="__DIX_BASE_PATH__/static/css/legacy.css?v=legacy1">
    <script src="__DIX_BASE_PATH__/static/vendor/tailwind.js?v=legacy1"></script>
    <script src="__DIX_BASE_PATH__/static/vendor/alpine.min.js?v=legacy1" defer></script>
    <script src="__DIX_BASE_PATH__/static/vendor/vis-network.min.js?v=legacy1"></script>
    <script src="__DIX_BASE_PATH__/static/vendor/mermaid.min.js?v=legacy1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f5ff',
                            100: '#e0eaff',
                            500: '#667eea',
                            600: '#5a67d8',
                            700: '#4c51bf',
                        }
                    }
                }
            }
        }
    </script>
</head>
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    <div x-data="app()" x-init="init()" class="flex flex-col h-full">
        <!-- Header -->
        <header class="bg-gradient-to-r from-primary-500 to-purple-600 text-white px-6 py-4 shadow-lg flex-shrink-0">
            <div class="flex items-center justify-between">
                <div>

                    <h1 class="text-xl font-semibold flex items-center gap-2">
                        <span>🔗</span> Dix 依赖关系可视化
                    </h1>
                    <div class="mt-1 text-sm text-white/80 flex gap-6">
                        <span>📦 <span x-text="stats.package_count">-</span> 包</span>
                        <span>⚡ <span x-text="stats.provider_count">-</span> Providers</span>
                        <span>📎 <span x-text="stats.edge_count">-</span> 依赖</span>
                        <span class="px-2 py-0.5 rounded bg-white/20 text-white/90 text-xs"
                            x-text="`UI: ${uiVersion}`"></span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="openDiagnosticModal('trace')"
                        class="px-3 py-2 text-sm rounded-lg bg-white/20 hover:bg-white/30 transition flex items-center gap-2">
                        <span>🧵</span>
                        <span>Trace 诊断</span>
                    </button>
                    <div class="relative" x-data="{ open:false }">
                        <button @click="open = !open"
                            class="px-3 py-2 text-sm rounded-lg bg-white/20 hover:bg-white/30 transition flex items-center gap-2">
                            <span>🧪</span>
                            <span>诊断菜单</span>
                        </button>
                        <div x-show="open" x-cloak @click.outside="open = false"
                            class="absolute right-0 mt-2 w-72 bg-white text-gray-700 rounded-lg shadow-xl border border-gray-200 z-50 overflow-hidden">
                            <button @click="openDiagnosticModal('runtime'); open=false"
                                class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 flex items-center justify-between">
                                <span>⏱ Provider 启动耗时</span>
                                <span class="text-xs text-gray-400" x-text="runtimeStats.length"></span>
                            </button>
                            <button @click="openDiagnosticModal('errors'); open=false"
                                class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 flex items-center justify-between border-t border-gray-100">
                                <span>🚨 最近注入错误</span>
                                <span class="text-xs text-gray-400" x-text="recentErrors.length"></span>
                            </button>
                            <button @click="openDiagnosticModal('trace'); open=false"
                                class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 flex items-center justify-between border-t border-gray-100">
                                <span>🧵 调用链 Trace</span>
                                <span class="text-xs text-gray-400" x-text="traceRecords.length"></span>
                            </button>
                            <button @click="openDiagnosticModal('error-guide'); open=false"
                                class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 border-t border-gray-100">
                                🧭 错误类型说明
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Left Sidebar - Package List (Collapsible) -->
            <aside :class="sidebarCollapsed ? 'w-12' : 'w-72'"
                class="bg-white border-r border-gray-200 flex flex-col flex-shrink-0 transition-all duration-300">
                <!-- Collapse Toggle Button -->
                <div class="p-2 border-b border-gray-200 bg-gray-50 flex items-center"
                    :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">
                    <h3 x-show="!sidebarCollapsed" class="text-sm font-semibold text-gray-600 pl-2">📦 包列表</h3>
                    <button @click="sidebarCollapsed = !sidebarCollapsed"
                        class="p-1.5 hover:bg-gray-200 rounded transition"
                        :title="sidebarCollapsed ? '展开侧边栏' : '收起侧边栏'">
                        <svg x-show="!sidebarCollapsed" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                        </svg>
                        <svg x-show="sidebarCollapsed" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

                <!-- Sidebar Content (hidden when collapsed) -->
                <template x-if="!sidebarCollapsed">
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <div class="p-4 border-b border-gray-200">
                            <div class="relative">
                                <input type="text" x-model="packageSearch" placeholder="搜索包名..."
                                    class="w-full pl-9 pr-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2">
                            <!-- All packages option -->
                            <div @click="selectPackage(null)"
                                :class="{'bg-primary-500 text-white': !currentPackage, 'hover:bg-gray-100': currentPackage}"
                                class="p-3 rounded-lg cursor-pointer mb-1 transition">
                                <div class="font-medium text-sm">📁 全部</div>
                                <span
                                    :class="{'bg-white/20 text-white': !currentPackage, 'bg-gray-200 text-gray-600': currentPackage}"
                                    class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs"
                                    x-text="totalProviders + ' providers'"></span>
                            </div>
                            <!-- Package items -->
                            <template x-for="pkg in filteredPackages" :key="pkg.name">
                                <div @click="selectPackage(pkg.name)"
                                    :class="{'bg-primary-500 text-white': currentPackage === pkg.name, 'hover:bg-gray-100': currentPackage !== pkg.name}"
                                    class="p-3 rounded-lg cursor-pointer mb-1 transition">
                                    <div class="font-medium text-sm break-all" x-text="formatPackageName(pkg.name)">
                                    </div>
                                    <span
                                        :class="{'bg-white/20 text-white': currentPackage === pkg.name, 'bg-gray-200 text-gray-600': currentPackage !== pkg.name}"
                                        class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs"
                                        x-text="pkg.provider_count + ' providers'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Collapsed state icons -->
                <div x-show="sidebarCollapsed" class="flex-1 overflow-y-auto py-2">
                    <div @click="sidebarCollapsed = false; selectPackage(null)"
                        :class="{'bg-primary-500 text-white': !currentPackage}"
                        class="mx-2 p-2 rounded-lg cursor-pointer mb-1 flex items-center justify-center hover:bg-gray-100 transition"
                        title="全部">
                        📁
                    </div>
                </div>
            </aside>

            <!-- Main Graph Area -->
            <main class="flex-1 flex flex-col bg-white min-w-0">
                <!-- Toolbar -->
                <div class="px-4 py-3 border-b border-gray-200 bg-gray-50 flex items-center gap-4 flex-wrap">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">视图:</span>
                        <button @click="switchView('providers')"
                            :class="{'bg-primary-500 text-white border-primary-500': currentView === 'providers', 'bg-white hover:bg-gray-50': currentView !== 'providers'}"
                            class="px-3 py-1.5 text-sm border rounded-lg transition flex items-center gap-1">
                            <span>⚡</span> Providers
                        </button>
                        <button @click="switchView('types')"
                            :class="{'bg-primary-500 text-white border-primary-500': currentView === 'types', 'bg-white hover:bg-gray-50': currentView !== 'types'}"
                            class="px-3 py-1.5 text-sm border rounded-lg transition flex items-center gap-1">
                            <span>🔷</span> 类型依赖
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">布局:</span>
                        <select x-model="currentLayout" @change="renderGraph()"
                            class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="hierarchical">层级布局</option>
                            <option value="force">力导向</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">深度:</span>
                        <select x-model="currentDepth" @change="onDepthChange()"
                            class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="1">1 级</option>
                            <option value="2">2 级</option>
                            <option value="3">3 级</option>
                            <option value="5">5 级</option>
                            <option value="10">10 级</option>
                            <option value="0">全部</option>
                        </select>
                        <span class="text-[11px] text-gray-400">0=全部，最大128</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-2 text-xs font-medium text-gray-500 cursor-pointer">
                            <input type="checkbox" x-model="aggregateGroups" @change="saveLocalState(); renderGraph()"
                                class="rounded border-gray-300">
                            按分组聚合
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-2 text-xs font-medium text-gray-500 cursor-pointer">
                            <input type="checkbox" x-model="debugGroupMatching" class="rounded border-gray-300">
                            调试分组匹配
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-gray-500">前缀过滤:</span>
                        <input type="text" x-model="filterPrefix" @input="renderGraph()" placeholder="输入包路径/类型/函数前缀"
                            class="w-64 px-2 py-1 text-xs border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none">
                        <button @click="filterPrefix=''; renderGraph()"
                            class="px-2 py-1 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                            清除
                        </button>
                    </div>
                    <details class="text-xs">
                        <summary class="cursor-pointer text-gray-500">分组清单</summary>
                        <div class="mt-2 bg-white border border-gray-200 rounded-lg p-3 w-[520px]">
                            <div class="flex items-center gap-2 mb-2">
                                <input type="text" x-model="newGroupName" placeholder="组名（如 service）"
                                    class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none">
                                <input type="text" x-model="newGroupPrefix"
                                    placeholder="匹配前缀（如 github.com/acme/app/service/）"
                                    class="flex-[2] px-2 py-1 text-xs border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none">
                                <button @click="addGroup()"
                                    class="px-2 py-1 text-xs bg-primary-500 text-white rounded-md hover:bg-primary-600">
                                    添加
                                </button>
                            </div>
                            <div class="mb-2">
                                <div class="text-[11px] text-gray-500 mb-1">可选前缀（来自包路径，点击填充）</div>
                                <div class="flex flex-wrap gap-2 max-h-24 overflow-y-auto">
                                    <template x-for="p in prefixSuggestions" :key="p">
                                        <button @click="newGroupPrefix = p"
                                            class="px-2 py-1 text-[11px] border border-gray-200 rounded-md hover:bg-gray-50"
                                            x-text="p"></button>
                                    </template>
                                    <div x-show="prefixSuggestions.length === 0" class="text-[11px] text-gray-400">
                                        暂无可选前缀</div>
                                </div>
                            </div>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                <template x-for="(grp, gidx) in groupRules" :key="grp.name">
                                    <div class="border border-gray-200 rounded-md p-2">
                                        <div class="flex items-center justify-between mb-1">
                                            <div class="font-medium text-gray-700" x-text="grp.name"></div>
                                            <button @click="removeGroup(gidx)"
                                                class="text-xs text-red-500 hover:underline">
                                                删除组
                                            </button>
                                        </div>
                                        <div class="flex items-center gap-2 mb-2">
                                            <input type="text" x-model="grp._rename" placeholder="新组名"
                                                class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none">
                                            <button @click="renameGroup(gidx)"
                                                class="px-2 py-1 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                                                修改
                                            </button>
                                        </div>
                                        <div class="space-y-1">
                                            <template x-for="(p, pidx) in grp.prefixes" :key="p + pidx">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-gray-500 break-all" x-text="p"></span>
                                                    <button @click="removePrefix(gidx, pidx)"
                                                        class="text-xs text-red-400 hover:underline">
                                                        移除
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="flex items-center gap-2 mt-2">
                                            <input type="text" x-model="grp._newPrefix" placeholder="新增前缀"
                                                class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none">
                                            <button @click="addPrefix(gidx)"
                                                class="px-2 py-1 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                                                添加前缀
                                            </button>
                                        </div>
                                    </div>
                                </template>
                                <div x-show="groupRules.length === 0" class="text-gray-400 text-xs">暂无分组</div>
                            </div>
                        </div>
                    </details>
                    <button @click="resetView()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition flex items-center gap-1">
                        <span>🔄</span> 重置
                    </button>
                    <button @click="exportSvg()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition flex items-center gap-1"
                        :disabled="!network">
                        <span>⬇️</span> 下载 SVG
                    </button>
                    <button @click="openMermaid()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition flex items-center gap-1"
                        :disabled="!network">
                        <span>🧩</span> Mermaid
                    </button>

                    <!-- Global Search -->
                    <div class="flex-1"></div>
                    <div class="relative" x-data="{ open: false }">
                        <input type="text" x-model="globalSearch" @input="onGlobalSearchInput()" @focus="open = true"
                            @keydown.escape="open = false" @keydown.enter="selectFirstSearchResult()"
                            placeholder="搜索类型或函数名..."
                            class="w-64 pl-9 pr-4 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>

                        <!-- Search Results Dropdown -->
                        <div x-show="open && globalSearch.length > 0 && searchResults.length > 0"
                            @click.outside="open = false" x-cloak
                            class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-80 overflow-y-auto z-50">
                            <template x-for="(result, index) in searchResults" :key="result.id">
                                <div @click="selectSearchResult(result); open = false"
                                    :class="{'bg-primary-50': index === 0}"
                                    class="px-3 py-2 hover:bg-gray-100 cursor-pointer border-b border-gray-100 last:border-0">
                                    <div class="flex items-center gap-2">
                                        <span :class="{
                                                'bg-green-100 text-green-700': result.type === 'provider',
                                                'bg-blue-100 text-blue-700': result.type === 'type'
                                            }" class="px-1.5 py-0.5 rounded text-xs font-medium"
                                            x-text="result.type === 'provider' ? 'Provider' : 'Type'"></span>
                                        <span class="text-sm font-medium text-gray-700 truncate"
                                            x-text="result.label"></span>
                                    </div>
                                    <div class="text-xs text-gray-400 truncate mt-0.5" x-text="result.fullName"></div>
                                </div>
                            </template>
                            <div x-show="searchResults.length === 0 && globalSearch.length > 0"
                                class="px-3 py-4 text-center text-gray-400 text-sm">
                                未找到匹配结果
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Graph Container -->
                <div class="flex-1 relative">
                    <div id="network" class="w-full h-full"></div>
                    <!-- Loading Overlay -->
                    <div x-show="loading" x-cloak
                        class="absolute inset-0 bg-white/90 flex items-center justify-center z-50">
                        <div class="text-center">
                            <div
                                class="w-10 h-10 border-3 border-gray-200 border-t-primary-500 rounded-full animate-spin mx-auto mb-3">
                            </div>
                            <div class="text-gray-500 text-sm">加载中...</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar - Details -->
            <aside class="w-80 bg-white border-l border-gray-200 flex flex-col flex-shrink-0">
                <div class="p-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-sm font-semibold text-gray-600">📋 节点详情</h3>
                </div>
                <div class="flex-1 overflow-y-auto p-4">
                    <!-- Empty State -->
                    <div x-show="!selectedNode" class="text-center py-12 text-gray-400">
                        <div class="text-5xl mb-3">👆</div>
                        <div>点击节点查看详情</div>
                    </div>
                    <!-- Provider Detail -->
                    <template x-if="selectedNode && selectedNode.data && selectedNode.data.function_name">
                        <div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">函数名</h4>
                                <div class="text-sm text-gray-700 break-all leading-relaxed"
                                    x-text="selectedNode.data.function_name"></div>
                            </div>
                            <div class="mb-4" x-show="isProviderTimedOut(selectedNode.data)">
                                <div
                                    class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-red-100 text-red-700 text-xs font-medium">
                                    <span>⏱</span>
                                    <span>该 Provider 最近一次执行发生超时</span>
                                </div>
                            </div>
                            <div class="mb-4" x-show="isProviderErrored(selectedNode.data)">
                                <div
                                    class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-red-100 text-red-700 text-xs font-medium">
                                    <span>🚨</span>
                                    <span x-text="providerErrorSummary(selectedNode.data)"></span>
                                </div>
                            </div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">输出类型</h4>
                                <div class="space-y-1">
                                    <template x-for="outType in providerOutputTypes(selectedNode.data)"
                                        :key="`detail-out-${outType}`">
                                        <div @click="showDependencyGraph(outType, 'type')"
                                            class="text-sm text-primary-600 break-all leading-relaxed cursor-pointer hover:underline"
                                            x-text="outType"></div>
                                    </template>
                                </div>
                            </div>
                            <div class="mb-5" x-show="selectedNode.data.function_pkg">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">函数包路径</h4>
                                <div class="text-sm text-gray-700 break-all leading-relaxed"
                                    x-text="selectedNode.data.function_pkg"></div>
                            </div>
                            <div class="mb-5" x-show="selectedNode.data.function_file">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">代码位置</h4>
                                <div class="text-sm text-gray-700 break-all leading-relaxed"
                                    x-text="`${selectedNode.data.function_file || ''}:${selectedNode.data.function_line || 0}`">
                                </div>
                            </div>
                            <div class="mb-5">
                                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">
                                    输入类型 (<span x-text="(selectedNode.data.input_types || []).length"></span>)
                                </h4>
                                <ul class="space-y-1">
                                    <template x-for="inputType in (selectedNode.data.input_types || [])"
                                        :key="inputType">
                                        <li @click="showDependencyGraph(inputType, 'type')"
                                            class="px-3 py-2 bg-gray-100 rounded text-xs break-all cursor-pointer hover:bg-primary-100 transition"
                                            x-text="inputType"></li>
                                    </template>
                                </ul>
                            </div>
                            <template x-if="getRuntimeStatForProvider(selectedNode.data)">
                                <div class="mb-5">
                                    <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">启动耗时</h4>
                                    <div class="space-y-1 text-xs bg-gray-50 border border-gray-200 rounded-lg p-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-gray-500">总耗时</span>
                                            <span class="font-semibold text-gray-700"
                                                x-text="formatDurationNs(getRuntimeStatForProvider(selectedNode.data).total_duration)"></span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-gray-500">平均耗时</span>
                                            <span class="font-semibold text-gray-700"
                                                x-text="formatDurationNs(getRuntimeStatForProvider(selectedNode.data).average_duration)"></span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-gray-500">最后一次</span>
                                            <span class="font-semibold text-gray-700"
                                                x-text="formatDurationNs(getRuntimeStatForProvider(selectedNode.data).last_duration)"></span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-gray-500">调用次数</span>
                                            <span class="font-semibold text-gray-700"
                                                x-text="getRuntimeStatForProvider(selectedNode.data).call_count"></span>
                                        </div>
                                        <div class="flex items-start justify-between"

                                    class="px-2 py-1 text-[11px] border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none bg-white">
                                    <option value="">状态</option>
                                    <option value="start">start</option>
                                    <option value="ok">ok</option>
                                    <option value="error">error</option>
                                </select>
                                <input type="text" x-model="traceEvent" placeholder="event 过滤"
                                    class="min-w-[120px] flex-1 px-2 py-1 text-[11px] border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none bg-white">
                                <label class="flex items-center gap-1 text-[11px] text-gray-600 shrink-0">
                                    <input type="checkbox" x-model="traceTreeMode" class="rounded border-gray-300">
                                    树形
                                </label>
                                <select x-show="traceTreeMode" x-model="traceIndentMode"
                                    class="px-2 py-1 text-[11px] border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none bg-white">
                                    <option value="log">缩进：对数</option>
                                    <option value="linear">缩进：线性</option>
                                </select>
                                <label class="flex items-center gap-1 text-[11px] text-gray-600 shrink-0">
                                    <input type="checkbox" x-model="traceOnlyErrorSpan" class="rounded border-gray-300">
                                    仅错误
                                </label>
                                <span class="text-[11px] text-gray-500 shrink-0">深度</span>
                                <select x-model="traceDepth"
                                    class="px-2 py-1 text-[11px] border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 outline-none bg-white">
                                    <option value="0">全部</option>
                                    <option value="1">1 级</option>
                                    <option value="2">2 级</option>
                                    <option value="3">3 级</option>
                                    <option value="5">5 级</option>
                                    <option value="10">10 级</option>
                                    <option value="20">20 级</option>
                                </select>
                                <button @click="collapseAllTraceGroups()"
                                    class="px-2 py-1 text-[11px] border border-gray-300 rounded-md bg-white hover:bg-gray-100">
                                    折叠全部
                                </button>
                                <button @click="expandAllTraceGroups()"
                                    class="px-2 py-1 text-[11px] border border-gray-300 rounded-md bg-white hover:bg-gray-100">
                                    展开全部
                                </button>
                                <button @click="refreshTraceFromModal()"
                                    class="px-2.5 py-1 text-[11px] border border-gray-300 rounded-md bg-white hover:bg-gray-100"
                                    :disabled="traceLoading">刷新</button>
                            </div>

                            <div class="text-[11px] text-gray-500"
                                x-text="traceViewMode === 'span'
                                    ? `事件 ${traceRecords.length} · Span ${traceSpanTotal} · 链路 ${traceGroups.length}`
                                    : `总 ${traceRecords.length} · 过滤 ${filteredModalTraceRecords.length} · 链路 ${traceGroups.length}`">
                            </div>
                            <div class="text-xs text-red-500" x-show="traceError" x-text="traceError"></div>

                            <template x-if="filteredModalTraceRecords.length === 0">
                                <div class="p-4 text-sm text-gray-400 border border-gray-200 rounded-lg">暂无匹配 Trace 记录
                                </div>
                            </template>

                            <div :class="isSingleTraceView() ? 'flex-1 min-h-0' : 'space-y-2'">
                                <template x-for="(group, gIdx) in traceGroups"
                                    :key="`trace-group-${group.traceId || gIdx}`">
                                    <div class="border rounded-lg p-3" :class="{
                                        'border-red-200 bg-red-50/20': group.hasSpanError,
                                        'border-gray-200 bg-white': !group.hasSpanError,
                                        'flex-1 min-h-0 flex flex-col': isSingleTraceView(),
                                    }">
                                        <div class="flex items-center justify-between gap-2 mb-2">
                                            <div class="min-w-0">
                                                <div class="text-[11px] text-gray-500">trace_id</div>
                                                <div class="flex items-center gap-2 min-w-0">
                                                    <div class="text-xs font-semibold text-gray-800 break-all"
                                                        x-text="group.traceId || '(missing-trace-id)'"></div>
                                                    <span x-show="group.hasSpanError"
                                                        class="shrink-0 px-1.5 py-0.5 rounded bg-red-100 text-red-700 text-[10px] font-semibold">span-error</span>
                                                </div>
                                                <div class="mt-0.5 text-[10px] text-gray-600 break-all"
                                                    x-show="group.injectFunction"
                                                    x-text="`inject: ${group.injectFunction}`"></div>
                                            </div>
                                            <div class="text-right text-[11px] text-gray-500 shrink-0">
                                                <button @click="toggleTraceGroupCollapse(group.traceId)"
                                                    class="mb-1 px-1.5 py-0.5 rounded border border-gray-300 bg-white text-[10px] text-gray-600 hover:bg-gray-50"
                                                    :title="isTraceGroupCollapsed(group.traceId) ? '展开该 trace' : '折叠该 trace'"
                                                    x-text="isTraceGroupCollapsed(group.traceId) ? '▸ 展开' : '▾ 折叠'"></button>
                                                <button @click="focusSingleTrace(group.traceId)"
                                                    class="mb-1 ml-1 px-1.5 py-0.5 rounded border border-blue-300 bg-blue-50 text-[10px] text-blue-700 hover:bg-blue-100"
                                                    title="仅查看当前 trace（自动过滤并全屏）">
                                                    仅看此条
                                                </button>
                                                <div x-text="`events ${group.total}`"></div>
                                                <div x-text="`errors ${group.errorCount}`"></div>
                                                <div x-show="group.hasSpanError" class="text-red-600"
                                                    x-text="`span ${group.spanErrorCount}`"></div>
                                            </div>
                                        </div>

                                        <div x-show="!isTraceGroupCollapsed(group.traceId)"
                                            :class="isSingleTraceView() ? 'flex-1 min-h-0 space-y-1.5 overflow-y-auto border border-gray-100 rounded-md p-2 bg-gray-50/50' : 'space-y-1.5 max-h-72 overflow-y-auto border border-gray-100 rounded-md p-2 bg-gray-50/50'">
                                            <template x-if="traceViewMode === 'span'">
                                                <div class="space-y-1.5">
                                                    <template
                                                        x-for="(item, idx) in (traceTreeMode ? group.visibleSpanRows : group.spanRows)"
                                                        :key="`trace-span-${group.traceId}-${item.span_id || idx}-${idx}`">
                                                        <div class="text-xs border rounded p-2"
                                                            :class="item.status === 'error' ? 'border-red-200 bg-red-50/40' : 'border-gray-200 bg-white'"
                                                            :style="traceTreeMode ? traceIndentStyle(item) : ''">
                                                            <div class="flex items-center gap-2 flex-wrap mb-1">
                                                                <button x-show="traceTreeMode && item._canToggle"
                                                                    @click.stop="toggleTraceSpanCollapse(group.traceId, item.span_id)"
                                                                    class="px-1 py-0.5 rounded border border-gray-300 bg-white text-[10px] text-gray-600 hover:bg-gray-50"
                                                                    :title="isTraceSpanCollapsed(group.traceId, item.span_id) ? '展开子链路' : '折叠子链路'"
                                                                    x-text="isTraceSpanCollapsed(group.traceId, item.span_id) ? '▸' : '▾'"></button>
                                                                <span x-show="traceTreeMode"
                                                                    class="px-1 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px]"
                                                                    x-text="`L${item._depth || 0}`"></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-700 font-medium"
                                                                    x-text="item.operation || '-' "></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
                                                                    :class="item.status === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'"
                                                                    x-text="item.status || 'ok'"></span>
                                                                <span class="text-[10px] text-gray-500"
                                                                    x-text="`events:${item.event_count || 0}`"></span>
                                                                <span class="text-[10px] text-gray-400"
                                                                    x-text="formatErrorTime(item.occurred_at_unix_nano)"></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all">
                                                                <span class="text-gray-500">span:</span>
                                                                <span x-text="item.span_id || '-' "></span>
                                                                <span class="text-gray-500 ml-2">parent:</span>
                                                                <span x-text="item.parent_span_id || '-' "></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all"
                                                                x-show="traceProviderLabel(item)">
                                                                <span x-text="traceProviderLabel(item)"></span>
                                                            </div>
                                                            <details class="mt-1"
                                                                x-show="traceProviderFunctions(item).length > 1">
                                                                <summary
                                                                    class="text-[10px] text-gray-500 cursor-pointer hover:text-gray-700">
                                                                    全部 provider
                                                                </summary>
                                                                <ul class="mt-1 space-y-0.5">
                                                                    <template
                                                                        x-for="(fn, fidx) in traceProviderFunctions(item)"
                                                                        :key="`trace-span-provider-${item.span_id || 'x'}-${fidx}`">
                                                                        <li class="text-[10px] text-gray-600 break-all"
                                                                            x-text="fn"></li>
                                                                    </template>
                                                                </ul>
                                                            </details>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceOutputType(item)"
                                                                x-text="`output: ${traceOutputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceInputType(item)"
                                                                x-text="`input: ${traceInputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceTypeMeta(item)"
                                                                x-text="traceTypeMeta(item)">
                                                            </div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="item.duration_ns"
                                                                x-text="`duration: ${formatDurationNs(item.duration_ns)}`">
                                                            </div>
                                                            <div x-show="traceErrorText(item)"
                                                                class="mt-1 rounded border border-red-200 bg-red-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-red-600">
                                                                    error
                                                                </div>
                                                                <pre class="mt-0.5 text-[11px] text-red-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorMultilineText(item)"></pre>
                                                            </div>
                                                            <div x-show="traceErrorContext(item)"
                                                                class="mt-1 rounded border border-amber-200 bg-amber-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-amber-700">
                                                                    ctx
                                                                </div>
                                                                <pre class="mt-0.5 text-[10px] text-amber-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorContextMultiline(item)"></pre>
                                                            </div>
                                                            <div class="text-[10px] text-blue-700 break-all"
                                                                x-show="tracePackagePathLabel(item)"
                                                                x-text="`pkg: ${tracePackagePathLabel(item)}`"></div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <template x-if="traceViewMode !== 'span'">
                                                <div class="space-y-1.5">
                                                    <template
                                                        x-for="(item, idx) in (traceTreeMode ? group.visibleTreeRows : group.records)"
                                                        :key="`trace-item-${group.traceId}-${item.id || idx}-${idx}`">
                                                        <div class="text-xs border rounded p-2"
                                                            :class="item.status === 'error' ? 'border-red-200 bg-red-50/40' : 'border-gray-200 bg-white'"
                                                            :style="traceTreeMode ? traceIndentStyle(item) : ''">
                                                            <div class="flex items-center gap-2 flex-wrap mb-1">
                                                                <button x-show="traceTreeMode && item._canToggle"
                                                                    @click.stop="toggleTraceSpanCollapse(group.traceId, item.span_id)"
                                                                    class="px-1 py-0.5 rounded border border-gray-300 bg-white text-[10px] text-gray-600 hover:bg-gray-50"
                                                                    :title="isTraceSpanCollapsed(group.traceId, item.span_id) ? '展开子链路' : '折叠子链路'"
                                                                    x-text="isTraceSpanCollapsed(group.traceId, item.span_id) ? '▸' : '▾'"></button>
                                                                <span x-show="traceTreeMode"
                                                                    class="px-1 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px]"
                                                                    x-text="`L${item._depth || 0}`"></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-700 font-medium"
                                                                    x-text="item.operation || '-' "></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
                                                                    :class="item.status === 'error' ? 'bg-red-100 text-red-700' : (item.status === 'start' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700')"
                                                                    x-text="item.status || 'ok'"></span>
                                                                <span
                                                                    class="px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 text-[10px]"
                                                                    x-text="item.event || '-' "></span>
                                                                <span class="text-[10px] text-gray-400"
                                                                    x-text="formatErrorTime(item.occurred_at_unix_nano)"></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all">
                                                                <span class="text-gray-500">span:</span>
                                                                <span x-text="item.span_id || '-' "></span>
                                                                <span class="text-gray-500 ml-2">parent:</span>
                                                                <span x-text="item.parent_span_id || '-' "></span>
                                                            </div>
                                                            <div class="text-[11px] text-gray-700 break-all"
                                                                x-show="traceProviderLabel(item)">
                                                                <span x-text="traceProviderLabel(item)"></span>
                                                            </div>
                                                            <details class="mt-1"
                                                                x-show="traceProviderFunctions(item).length > 1">
                                                                <summary
                                                                    class="text-[10px] text-gray-500 cursor-pointer hover:text-gray-700">
                                                                    全部 provider
                                                                </summary>
                                                                <ul class="mt-1 space-y-0.5">
                                                                    <template
                                                                        x-for="(fn, fidx) in traceProviderFunctions(item)"
                                                                        :key="`trace-event-provider-${item.span_id || 'x'}-${fidx}`">
                                                                        <li class="text-[10px] text-gray-600 break-all"
                                                                            x-text="fn"></li>
                                                                    </template>
                                                                </ul>
                                                            </details>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceOutputType(item)"
                                                                x-text="`output: ${traceOutputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceInputType(item)"
                                                                x-text="`input: ${traceInputType(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="traceTypeMeta(item)"
                                                                x-text="traceTypeMeta(item)">
                                                            </div>
                                                            <div x-show="traceErrorText(item)"
                                                                class="mt-1 rounded border border-red-200 bg-red-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-red-600">
                                                                    error
                                                                </div>
                                                                <pre class="mt-0.5 text-[11px] text-red-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorMultilineText(item)"></pre>
                                                            </div>
                                                            <div x-show="traceErrorContext(item)"
                                                                class="mt-1 rounded border border-amber-200 bg-amber-50/60 p-2">
                                                                <div
                                                                    class="text-[10px] font-semibold uppercase tracking-wide text-amber-700">
                                                                    ctx
                                                                </div>
                                                                <pre class="mt-0.5 text-[10px] text-amber-700 whitespace-pre-wrap break-all leading-relaxed"
                                                                    x-text="traceErrorContextMultiline(item)"></pre>
                                                            </div>
                                                            <div class="text-[10px] text-blue-700 break-all"
                                                                x-show="tracePackagePathLabel(item)"
                                                                x-text="`pkg: ${tracePackagePathLabel(item)}`"></div>
                                                            <div class="text-[11px] text-gray-600 break-all"
                                                                x-show="item.duration_ns"
                                                                x-text="`duration: ${formatDurationNs(item.duration_ns)}`">
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Mermaid Modal -->
        <div x-show="mermaidOpen" x-cloak class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
            @keydown.escape.window="mermaidOpen = false">
            <div class="bg-white w-[90vw] h-[85vh] rounded-xl shadow-xl flex flex-col">
                <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
                    <div class="font-semibold text-gray-700">🧩 Mermaid 预览</div>
                    <button @click="mermaidOpen = false"
                        class="px-2 py-1 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                        关闭
                    </button>
                </div>
                <div class="flex-1 grid grid-cols-2 gap-4 p-4 overflow-hidden">
                    <div class="flex flex-col h-full">
                        <div class="text-xs text-gray-500 mb-2">Mermaid 源码</div>
                        <textarea x-model="mermaidSource"
                            class="flex-1 w-full text-xs font-mono border border-gray-200 rounded-lg p-2 resize-none"></textarea>
                        <div class="mt-2 flex items-center gap-2">
                            <button @click="copyMermaidSource()"
                                class="px-3 py-1.5 text-xs border border-gray-300 rounded-md hover:bg-gray-50">
                                复制源码
                            </button>
                            <button @click="renderMermaid()"
                                class="px-3 py-1.5 text-xs bg-primary-500 text-white rounded-md hover:bg-primary-600">
                                重新渲染
                            </button>
                            <div x-show="mermaidError" class="text-xs text-red-500" x-text="mermaidError"></div>
                        </div>
                    </div>
                    <div class="flex flex-col h-full">
                        <div class="text-xs text-gray-500 mb-2">预览</div>
                        <div class="flex-1 border border-gray-200 rounded-lg p-3 overflow-auto mermaid-preview"
                            x-html="mermaidSvg"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>window.DIX_BASE = "__DIX_BASE_PATH__";</script>
    <script src="__DIX_BASE_PATH__/static/js/legacy/app.js?v=legacy1"></script>
</body>

</html>
